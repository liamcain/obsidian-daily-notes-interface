name: Publish to npm

on:
  push:
    tags:
      - "v*"

# Required for npm provenance: lets the workflow request an OIDC token
# that npm verifies to attest the publish came from this exact run.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install modules
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build:ci

      - name: Publish
        run: pnpm publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
